name: Keep Alive

on:
  schedule:
    # Runs every 5 minutes (UTC)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: |
          # Configure RENDER_API_URL in GitHub repo Secrets/Variables, or use default
          RENDER_URL="${{ secrets.RENDER_API_URL || vars.RENDER_API_URL || 'https://payforge-backend.onrender.com' }}"
          TARGET="${RENDER_URL%/}/health"
          echo "Pinging ${TARGET} to keep Render awake..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$TARGET" || echo "FAILED")
          echo "Response code: $RESPONSE"
          if [ "$RESPONSE" = "200" ]; then
            echo "Render service is awake and healthy!"
          else
            echo "Pinged $TARGET (code: $RESPONSE)"
          fi
